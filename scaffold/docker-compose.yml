services:
  php_app:
    image: php:8.3-fpm
    volumes:
      - ./frontend:/var/www/html
  nginx_server:
    image: nginx:alpine
    ports:
      - "80:80" # change the first port number to match your needs
    volumes:
      - ./frontend:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  backend:
    build: ./backend
    command: uv run main.py
    restart: always
    ports:
      - "5000:5000"
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    ports:
      - "8080:8080"
    volumes:
      - ./pb_data:/pb_data
    command:
      - serve
      - --http=0.0.0.0:8080
      - --dir=/pb_data
    restart: unless-stopped
